<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Bridge · 随身工作区</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/vendor/xterm.css"><link rel="stylesheet" href="/style.css">
</head>
<body class="cg-app">
<svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5M13 17h6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6"/></symbol>
<symbol id="i-log-out" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m6-12 4 4-4 4M9 12h10"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
<symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
<symbol id="i-return" viewBox="0 0 24 24"><path d="M20 5v8H4m5-5-5 5 5 5"/></symbol>
</defs></svg>
<section id="login" class="login-screen">
<header class="login-header"><span class="brand"><span class="brand-mark">ab</span>Agent Bridge</span><label class="theme-control"><svg class="cg-icon" aria-hidden="true"><use href="#i-sun"/></svg><span class="cg-sr-only">外观</span><select class="theme-select" aria-label="登录页外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></header>
<main class="login-main"><div class="login-content"><div class="login-emblem"><svg class="cg-icon" aria-hidden="true"><use href="#i-terminal"/></svg></div><h1>连接你的工作区</h1><p class="login-description">电脑上的 Agent，随时接着用。</p><form id="loginForm"><div class="cg-field"><label for="token">访问密钥</label><input class="cg-input" id="token" type="password" autocomplete="current-password" required aria-describedby="tokenHelp notice" placeholder="输入电脑端显示的密钥"><p id="tokenHelp" class="cg-muted">在电脑的 Agent Bridge 启动窗口中查看。</p></div><button id="loginButton" class="cg-btn cg-btn--primary" type="submit">连接电脑<svg class="cg-icon" aria-hidden="true"><use href="#i-log-out"/></svg></button></form><div class="login-footnote"><svg class="cg-icon" aria-hidden="true"><use href="#i-lock"/></svg><span>仅连接你信任的电脑</span></div></div></main><footer class="login-footer">Agent Bridge <span>·</span> 你的随身终端</footer>
</section>
<section id="workspace" class="workspace" hidden>
<div id="sidebarSlot" class="sidebar-slot"><aside id="sidebar" class="sidebar" aria-label="会话导航"><div class="sidebar-head"><span class="brand"><span class="brand-mark">ab</span>Agent Bridge</span><button id="closeSidebar" class="cg-btn cg-btn--icon mobile-only" type="button" aria-label="关闭侧栏" title="关闭侧栏"><svg class="cg-icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><button class="cg-btn new-session" data-new-session type="button"><svg class="cg-icon" aria-hidden="true"><use href="#i-plus"/></svg>新建会话</button><div class="list-heading"><span>会话</span><button id="refresh" class="cg-btn cg-btn--icon" type="button" aria-label="刷新会话" title="刷新会话"><svg class="cg-icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div><nav id="sessionList" class="session-list" aria-label="终端会话"></nav><p id="sessionEmpty" class="session-empty">还没有会话。<br>新建一个，开始工作。</p><div class="sidebar-bottom"><div class="workspace-location"><svg class="cg-icon" aria-hidden="true"><use href="#i-folder"/></svg><div><span class="cg-muted">当前工作目录</span><p id="cwd"></p></div></div><label class="theme-control sidebar-theme"><svg class="cg-icon" aria-hidden="true"><use href="#i-sun"/></svg><span>外观</span><select class="theme-select" aria-label="工作区外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="logout" class="cg-nav-item" type="button"><svg class="cg-icon" aria-hidden="true"><use href="#i-log-out"/></svg>退出登录</button></div></aside></div>
<div id="mainPanel" class="main-panel"><header class="topbar"><div class="topbar-left"><button id="openSidebar" class="cg-btn cg-btn--icon" type="button" aria-label="打开会话侧栏" title="切换侧栏" aria-controls="sidebar" aria-expanded="true"><svg class="cg-icon" aria-hidden="true"><use href="#i-panel"/></svg></button><span id="sessionTitle" class="session-title">工作区</span><span class="terminal-label">终端</span></div><div class="topbar-right"><span id="status" class="connection-status" role="status">未连接</span><button id="stop" class="cg-btn cg-btn--icon cg-btn--danger" type="button" aria-label="关闭当前会话" title="关闭当前会话" disabled><svg class="cg-icon" aria-hidden="true"><use href="#i-trash"/></svg></button></div></header>
<main class="work-content"><section id="welcome" class="welcome"><div class="welcome-inner"><span class="welcome-symbol"><svg class="cg-icon" aria-hidden="true"><use href="#i-terminal"/></svg></span><h1>从哪里开始？</h1><p>选择一个 Agent，在电脑上开启新会话。</p><div class="agent-options"><button class="cg-btn agent-option" data-agent="codex" type="button"><span class="agent-letter">C</span><span>Codex</span><svg class="cg-icon" aria-hidden="true"><use href="#i-plus"/></svg></button><button class="cg-btn agent-option" data-agent="claude" type="button"><span class="agent-letter">Cl</span><span>Claude Code</span><svg class="cg-icon" aria-hidden="true"><use href="#i-plus"/></svg></button><button class="cg-btn agent-option" data-agent="shell" type="button"><svg class="cg-icon" aria-hidden="true"><use href="#i-terminal"/></svg><span>系统终端</span><svg class="cg-icon" aria-hidden="true"><use href="#i-plus"/></svg></button></div></div></section><section id="terminalPanel" class="terminal-panel" aria-label="当前会话的终端" hidden><div class="terminal-heading"><span><svg class="cg-icon" aria-hidden="true"><use href="#i-terminal"/></svg><span id="terminalCaption">终端输出</span></span><button id="latest" class="cg-btn latest-button" type="button" title="滚动到最新输出">回到最新</button></div><div id="terminal"></div></section>
<div class="input-area"><div class="keys" role="group" aria-label="终端快捷键"><button class="cg-btn key" data-key="\r" type="button"><svg class="cg-icon" aria-hidden="true"><use href="#i-return"/></svg>回车</button><button class="cg-btn key" data-key="\u001b" type="button">Esc</button><button class="cg-btn key" data-key="\u0003" type="button">Ctrl+C</button><button class="cg-btn key" data-key="\t" type="button">Tab</button><span class="key-divider"></span><button class="cg-btn key arrow-key" data-key="\u001b[A" type="button" aria-label="方向键上">↑</button><button class="cg-btn key arrow-key" data-key="\u001b[B" type="button" aria-label="方向键下">↓</button><button class="cg-btn key arrow-key" data-key="\u001b[D" type="button" aria-label="方向键左">←</button><button class="cg-btn key arrow-key" data-key="\u001b[C" type="button" aria-label="方向键右">→</button></div><form id="inputForm" class="composer"><label for="message" class="cg-sr-only">发送到终端的内容</label><textarea id="message" rows="2" maxlength="16000" placeholder="发送到电脑上的 Agent…"></textarea><div class="composer-tools"><label class="enter-option"><input id="enter" type="checkbox" checked>发送后回车</label><button id="send" class="cg-btn cg-btn--primary cg-btn--round send-button" type="submit" aria-label="发送到终端" title="发送到终端（Ctrl+Enter）" disabled><svg class="cg-icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div></form><p class="input-hint">手机断线后，电脑上的任务仍会继续运行。</p></div></main></div>
</section>
<dialog id="sidebarDialog" class="sidebar-dialog" aria-label="会话导航抽屉"></dialog>
<dialog id="newDialog" class="cg-dialog new-dialog" aria-labelledby="newDialogTitle"><div class="cg-dialog-header"><h2 id="newDialogTitle">新建会话</h2><button class="cg-btn cg-btn--icon" data-close="newDialog" type="button" aria-label="取消新建会话" title="关闭"><svg class="cg-icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><form id="createForm"><div class="cg-field"><label for="agent">选择 Agent</label><select id="agent" class="cg-select"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="shell">系统终端</option></select></div><div class="dialog-location"><svg class="cg-icon" aria-hidden="true"><use href="#i-folder"/></svg><p id="dialogCwd"></p></div><p class="cg-muted">新会话将在这个目录中启动。</p><p id="createError" class="inline-error" role="alert"></p><div class="dialog-actions"><button class="cg-btn cg-btn--secondary" data-close="newDialog" type="button">取消</button><button id="create" class="cg-btn cg-btn--primary" type="submit">创建会话</button></div></form></dialog>
<dialog id="deleteDialog" class="cg-dialog new-dialog" aria-labelledby="deleteTitle"><div class="cg-dialog-header"><h2 id="deleteTitle">关闭这个会话？</h2><button class="cg-btn cg-btn--icon" data-close="deleteDialog" type="button" aria-label="取消关闭会话"><svg class="cg-icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><p class="dialog-description">终端及其中正在运行的 Agent 将会停止。关闭手机页面不会停止任务。</p><p id="deleteError" class="inline-error" role="alert"></p><div class="dialog-actions"><button class="cg-btn cg-btn--secondary" data-close="deleteDialog" type="button">取消</button><button id="confirmDelete" class="cg-btn cg-btn--primary" type="button">关闭会话</button></div></dialog>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<script src="/vendor/xterm.js"></script><script src="/vendor/fit.js"></script><script src="/app.js"></script>
</body></html>
