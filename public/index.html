<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Agent Bridge · 随身控制台</title><link rel="stylesheet" href="/vendor/xterm.css"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">◈ <span>AGENT BRIDGE</span></div><span id="status">未连接</span></header>
<main><section id="login"><div class="eyebrow">YOUR DESKTOP, WITH YOU</div><h1>把电脑上的 Agent<br>装进口袋。</h1><p>通过安全隧道连接你的工作终端。</p><form id="loginForm"><label for="token">电脑端显示的访问密钥</label><input id="token" type="password" autocomplete="current-password" required placeholder="粘贴访问密钥"><button>连接电脑 →</button></form></section>
<section id="workspace" hidden><div class="toolbar"><select id="sessions" aria-label="会话列表"></select><select id="agent" aria-label="Agent 类型"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="shell">系统终端</option></select><button id="create">新建</button></div><div id="cwd"></div><div id="terminal"></div><div class="keys"><button data-key="\r">↵ 回车</button><button data-key="\u001b">Esc</button><button data-key="\u0003">Ctrl+C</button><button data-key="\t">Tab</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button></div><form id="inputForm"><textarea id="message" rows="2" maxlength="16000" placeholder="输入一个字符或一段指令…"></textarea><div class="compose"><label><input id="enter" type="checkbox" checked>发送后回车</label><button id="send" disabled>发送 ↑</button></div></form><footer><span>断开手机连接，电脑任务继续运行</span><button id="refresh">刷新会话</button><button id="stop" class="danger">关闭当前会话</button><button id="logout">退出登录</button></footer></section>
<div id="notice" role="status" aria-live="polite"></div></main><script src="/vendor/xterm.js"></script><script src="/vendor/fit.js"></script><script src="/app.js"></script></body></html>
